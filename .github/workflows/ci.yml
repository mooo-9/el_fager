name: tests

on:
  push:
    branches: [master]
  pull_request:
# Only master on push: a PR branch already gets covered by `pull_request`,
# and matching "**" here would run every job twice.

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the floor declared in pyproject.toml. Running the oldest
          # supported version is what keeps that floor honest — newer syntax
          # fails here rather than on someone's machine.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # tests/ui runs in the `ui` job below — it needs Qt and a display, and
      # dragging those into this job would slow every run. Everything here is
      # pure logic and runs headless.
      - run: pytest tests/ --ignore=tests/ui -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ui.txt

      # QtWebEngine is a Chromium build: it wants a GL/EGL stack present even
      # when it renders offscreen, and conftest imports it before QApplication.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxfixes3 libxi6 libxrender1 libfontconfig1 libfreetype6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libasound2t64

      - run: pip install -r requirements-ui.txt

      - name: pytest tests/ui
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a pytest tests/ui -q
