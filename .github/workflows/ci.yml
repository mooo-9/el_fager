name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A Windows run installs the full model stack; don't let superseded pushes pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # PyTorch CPU-only first, or the requirements install pulls the 2 GB CUDA build.
      - name: Install PyTorch (CPU-only)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      # Same gate as hooks/pre-push.
      - name: Run tests
        run: python -m pytest tests/ -q
