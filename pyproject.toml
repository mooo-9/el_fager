[project]
name = "el-fager"
version = "0.1.0"
description = "El Fager — personal Windows AI assistant"
# Floor is 3.12, not 3.11: tools/macro_tool.py uses a PEP 701 f-string
# (nested same-type quotes), which is a SyntaxError on 3.11 and earlier.
# CI runs on this exact version so the floor stays honest.
requires-python = ">=3.12"

[project.optional-dependencies]
# Everything needed to run `pytest tests/ --ignore=tests/ui`.
# Kept in sync with requirements-dev.txt, which is what CI installs.
dev = [
    "pytest>=8.0",
    "anthropic>=0.109.1",
    "cryptography>=41.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.27.0",
]
